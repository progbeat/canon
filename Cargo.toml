[package]
name = "canon"
version = "0.1.0"
edition = "2021"
description = "AI linter for project expectations"
license = "MIT"
repository = "https://github.com/progbeat/canon"

[dependencies]
clap = { version = "4.6.1", default-features = false, features = ["std", "help", "usage", "env"] }
getrandom = "0.3"
libc = "0.2"
minijinja = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
serde-saphyr = { version = "0.0.26", default-features = false, features = ["deserialize", "include"] }
sha1 = "0.10"
sha2 = "0.10"
which = "8.0.5"

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
# `canon check` catches unwinds to run its required finally outputs.
panic = "unwind"
strip = true
