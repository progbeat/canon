# `cap-N` selects a cost-efficient model/effort combination scoring N on the Artificial Analysis Intelligence Index; higher N means greater overall capability.

cap-40: &cap-40
  models: ["gpt-5.4-mini"]
  thinking: xhigh

cap-46:
  models: ["gpt-5.6-luna"]
  thinking: high

cap-49: &cap-49
  models: ["gpt-5.6-luna"]
  thinking: xhigh

cap-51:
  models: ["gpt-5.6-luna"]
  thinking: max

cap-52:
  models: ["gpt-5.6-terra"]
  thinking: xhigh

cap-55: &cap-55
  models: ["gpt-5.6-terra"]
  thinking: max

cap-56:
  models: ["gpt-5.6-sol"]
  thinking: high

cap-58:
  models: ["gpt-5.6-sol"]
  thinking: xhigh

cap-59:
  models: ["gpt-5.6-sol"]
  thinking: max

default: &default
  <<: *cap-40
  ignore:
    - ".canon/**"  # prevents evaluator agents from reading expected answers and avoids reevaluating full-scope expectations when canon changes
    - ".github/**"
    - "docker/**"
    - "docs/ai/**"
    - "skills/**"
    - ".dockerignore"
    - "AGENTS.md"
    - "Cargo.lock"
    - "Dockerfile"
    - "LICENSE"

smart:
  <<: *default
  models: ["gpt-5.6-terra"]
  thinking: xhigh

spark:
  <<: *default
  models: ["gpt-5.3-codex-spark"]
  thinking: high

docker:
  <<: *default
  ignore:  # overrides default_preset.ignore
    - ".canon/**"
    - ".github/**"
    - "docs/ai/**"
    - "skills/**"
    - "src/**"
    - "AGENTS.md"
    - "Cargo.lock"
    - "LICENSE"

_review-base: &review_base_preset
  <<: *default
  target: diff
  q-scope: ["."]
  ignore:
    - "docs/ai/**"
    - "skills/**"
    - "AGENTS.md"
    - "Cargo.lock"
    - "LICENSE"

patch-review:
  <<: *review_base_preset
  <<: *cap-49
  diff-from: :checkpoint

pr-review:
  <<: *review_base_preset
  <<: *cap-55
  target: diff
