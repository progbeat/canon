# Source: https://artificialanalysis.ai/models
# `cap-N` selects a cost-efficient model/effort combination scoring at least N on the Artificial Analysis Intelligence Index; higher N means greater overall capability.
# Costs are approximate weighted average costs per Intelligence Index task.

cap-59: &cap-59
  # ~$1.04
  models: ["gpt-5.6-sol"]
  thinking: max

cap-58:
  # ~$0.682
  models: ["gpt-5.6-sol"]
  thinking: xhigh

cap-56: &cap-56
  # ~$0.453
  models: ["gpt-5.6-sol"]
  thinking: high

cap-55: &cap-55 { <<: *cap-56 }

cap-54: &cap-54
  # ~$0.314
  models: ["gpt-5.6-sol"]
  thinking: medium

cap-50: &cap-50 { <<: *cap-54 }

cap-49: &cap-49
  # ~$0.139
  models: ["gpt-5.6-luna"]
  thinking: xhigh

cap-46: &cap-46
  # ~$0.095
  models: ["gpt-5.6-luna"]
  thinking: high

cap-45: &cap-45 { <<: *cap-46 }

cap-38:
  # ~$0.050
  models: ["gpt-5.6-luna"]
  thinking: medium

cap-max: *cap-59

#################

default: &default
  <<: *cap-45
  ignore:
    - ".canon/**"  # prevents evaluator agents from reading expected answers and avoids reevaluating full-scope expectations when canon changes
    - ".github/**"
    - "docker/**"
    - "docs/ai/**"
    - "skills/**"
    - ".dockerignore"
    - "AGENTS.md"
    - "Cargo.lock"
    - "Dockerfile"
    - "LICENSE"

smart:
  <<: *default
  models: ["gpt-5.6-terra"]
  thinking: xhigh

docker:
  <<: *default
  ignore:  # overrides default_preset.ignore
    - ".canon/**"
    - ".github/**"
    - "docs/ai/**"
    - "skills/**"
    - "src/**"
    - "AGENTS.md"
    - "Cargo.lock"
    - "LICENSE"

_review-base: &review_base_preset
  <<: *default
  target: diff
  q-scope: ["."]
  ignore:
    - "docs/ai/**"
    - "skills/**"
    - "AGENTS.md"
    - "Cargo.lock"
    - "LICENSE"

patch-review:
  <<: [*cap-49, *review_base_preset]
  diff-from: :checkpoint

pr-review:
  <<: [*cap-55, *review_base_preset]
  target: diff
