default: &default_preset
  models: ["gpt-5.6-luna", "gpt-5.3-codex-spark"]
  thinking: medium  # minimal | low | medium | high | xhigh
  ignore:
    - ".canon/**"  # prevents evaluator agents from reading expected answers and avoids reevaluating full-scope expectations when canon changes
    - ".github/**"
    - "docker/**"
    - "docs/ai/**"
    - "skills/**"
    - ".dockerignore"
    - "AGENTS.md"
    - "Cargo.lock"
    - "Dockerfile"
    - "LICENSE"

smart:
  <<: *default_preset
  models: ["gpt-5.6-terra"]
  thinking: xhigh

spark:
  <<: *default_preset
  models: ["gpt-5.3-codex-spark"]
  thinking: high

docker:
  <<: *default_preset
  ignore:  # overrides default_preset.ignore
    - ".canon/**"
    - ".github/**"
    - "docs/ai/**"
    - "skills/**"
    - "src/**"
    - "AGENTS.md"
    - "Cargo.lock"
    - "LICENSE"

pr-review:
  <<: *default_preset
  target: diff
  diff-from: master
  models: ["gpt-5.6-terra"]
  ignore:
    - "docs/ai/**"
    - "skills/**"
    - "AGENTS.md"
    - "Cargo.lock"
    - "LICENSE"
