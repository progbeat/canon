- q: "Does `docker/canon` run canon in an unprivileged Docker container, assuming `canon` itself is untrusted?"
  a: "yes"

- q: "Does `docker/canon` run Docker with `--rm -i --read-only` and without `-t`?"
  a: "yes"

- q: "Is `docker/canon` limited to minimal Docker invocation plumbing rather than reimplementing canon behavior?"
  a: "yes"

- q: "When `docker/canon` runs canon inside the container, does it pass `--no-sandbox`?"
  a: "yes"

- q: "Does `docker/canon` mount tmpfs at `/scratch`?"
  a: "yes"

- q: "Does `docker/canon` mount the repository at `/scratch/secret/repository`?"
  a: "yes"

- q: |
    Does `docker/canon` enforce this host-side trust boundary?
    - repository files are writable so `canon init` can create `.canon/check.yml`
    - repository Git metadata is read-only except Canon-owned persistent state
    - Codex home is read-only
  a: "yes"

- q: |
    Does the Dockerfile set these container environment variables?
    - CANON_SECRET_DIR=/scratch/secret/
    - CANON_SANDBOX_DIR=/scratch/sandbox
    - CODEX_HOME=/scratch/codex-home
  a: "yes"
