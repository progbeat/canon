version: 1

presets:
  default:
    models: ["gpt-5.4-mini", "gpt-5.3-codex-spark"]
    thinking: medium  # minimal | low | medium | high | xhigh
    plugins: []
    ignore:
      - ".canon/**"  # prevents evaluator agents from reading expected answers and avoids reevaluating full-scope expectations when canon changes
      - "AGENTS.md"

expectations:
  # - include: expects/*.yml

  # Expectations from specs:
  # - path: "specs/*.md"
  #   q_template: |
  #     {{content}}
  #     ---
  #     Does the implementation fully satisfy this specification?
  #   a: "yes"

  # Project quality
  - q: "Can you find any unnecessary copy-pasted code outside tests?"
    a: "no"
    cooldown: 7d
    thinking: xhigh

  - q: "With bounded configuration and retained data, is non-temporary project-owned persistent state across the whole project practically size-bounded across repeated normal command runs and configuration changes without manual cleanup?"
    a: "yes"
    cooldown: 7d
    thinking: xhigh

  - q: "Does the project avoid repeating expensive deterministic operations within a single high-level operation by reusing results keyed by all inputs that can affect them, including repository inspections, filesystem reads, parsed data, and derived hashes?"
    a: "yes"
    cooldown: 7d
    thinking: xhigh

  - q: "Are there any obsolete, unused, stray, dead-end, duplicated, or redundant Git-tracked project files or code paths that are safe to remove or consolidate without changing intended functionality?"
    a: "no"
    cooldown: 7d
    thinking: xhigh

  - q: "Are there any hand-written, non-generated source files that are excessively large or mix unrelated responsibilities enough that they should be split into smaller focused modules?"
    a: "no"
    cooldown: 7d
    thinking: xhigh

  - q: "Do any source-code boundaries hide dependencies or add indirection without clarifying ownership?"
    a: "no"
    cooldown: 7d
    thinking: xhigh

  - q: "Are there any dirty hacks that can be avoided?"
    a: "no"
    cooldown: 7d
    thinking: xhigh

  - q: "Are there any avoidable, violations of commonly accepted idiomatic practices that materially reduce this project's maintainability, correctness, readability, type safety, or future extensibility, excluding purely stylistic alternatives unless they create a concrete demonstrated risk?"
    a: "no"
    cooldown: 7d
    thinking: xhigh

  - q: "Can you find any high-confidence, practically exploitable security vulnerability?"
    a: "no"
    cooldown: 7d
    thinking: xhigh

  - q: "Are there any naming inconsistencies that would obviously be better to fix?"
    a: "no"
    cooldown: 7d
    thinking: xhigh

  # - q: "Can you find a critical high-confidence bug with a concrete failing scenario?"
  #   a: "no"
  #   cooldown: 7d
