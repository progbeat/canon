version: 1

presets:
  default: &default_preset
    models: ["gpt-5.4-mini", "gpt-5.3-codex-spark"]
    thinking: medium  # minimal | low | medium | high | xhigh
    ignore:
      - ".canon/**"  # prevents evaluator agents from reading expected answers and avoids reevaluating full-scope expectations when canon changes
      - "AGENTS.md"
  smart:
    <<: *default_preset
    models: ["gpt-5.5"]
    thinking: xhigh

expectations:
  # - include: expects/*.yml

  # Expectations from specs:
  # - path: "specs/*.md"
  #   q_template: |
  #     {{content}}
  #     ---
  #     Does the implementation fully satisfy this specification?
  #   a: "yes"

  # Project quality
  - q: "Can you find any unnecessary copy-pasted code outside tests?"
    a: "no"
    target: diff
    thinking: high

  - q: "Does the project avoid repeating expensive deterministic operations within a single high-level operation by reusing results keyed by all inputs that can affect them, including repository inspections, filesystem reads, parsed data, and derived hashes?"
    a: "yes"
    target: diff

  - q: "Can you find any obsolete, unused, stray, dead-end, duplicated, or redundant project files or code paths that are safe to remove or consolidate without changing intended functionality?"
    a: "no"
    target: diff

  - q: "Can you find any hand-written, non-generated source files that are excessively large or mix unrelated responsibilities enough that they should be split into smaller focused modules?"
    a: "no"
    target: diff
    thinking: high

  - q: "Can you find any source-code boundaries that hide dependencies or add indirection without clarifying ownership?"
    a: "no"
    target: diff
    thinking: high

  - q: "Can you find any dirty hacks that can be avoided?"
    a: "no"
    target: diff
    thinking: high

  - q: "Can you find any naming inconsistencies that would obviously be better to fix?"
    a: "no"
    target: diff
    thinking: high

  - q: "Can you find any avoidable violations of commonly accepted idiomatic practices that materially reduce this project's maintainability, correctness, readability, type safety, or future extensibility, excluding purely stylistic alternatives unless they create a concrete demonstrated risk?"
    a: "no"
    target: diff
    cooldown: {pass: 20m, fail: 20m}

  - q: "Can you find any high-confidence, practically exploitable security vulnerability?"
    a: "no"
    target: diff
    thinking: high
    cooldown: {pass: 20m, fail: 20m}

  - q: "Can you find a critical high-confidence bug with a concrete failing scenario?"
    a: "no"
    preset: smart
    target: diff
    cooldown: {pass: 20m, fail: 20m}
