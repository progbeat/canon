version: 1

presets:
  default: &default_preset
    models: ["gpt-5.4-mini", "gpt-5.3-codex-spark"]
    thinking: medium  # minimal | low | medium | high | xhigh
    ignore:
      - ".canon/**"  # prevents evaluator agents from reading expected answers and avoids reevaluating full-scope expectations when canon changes
      - ".github/**"
      - 'docker/**'
      - 'skills/**'
      - '.dockerignore'
      - "AGENTS.md"
      - "Cargo.lock"
      - "Dockerfile"
      - "LICENSE"
  smart:
    <<: *default_preset
    models: ["gpt-5.5"]
    thinking: xhigh
  spark:
    <<: *default_preset
    models: ["gpt-5.3-codex-spark"]
    thinking: high
  docker:
    <<: *default_preset
    ignore:  # overrides default_preset.ignore
      - ".canon/**"
      - ".github/**"
      - "skills/**"
      - "src/**"
      - "AGENTS.md"
      - "Cargo.lock"
      - "LICENSE"

expectations:
  - include: expects/*.yml

  # Glossary
  - path: "glossary.md"
    q_template: |
      {{content}}
      ---
      Is the implementation consistent with this glossary definition?
    a: "yes"
    target: diff

  # Specs
  - path: "specs/**.md"
    q_template: |
      {{content}}
      ---
      Does the implementation fully satisfy this specification?
    a: "yes"

  # Docker
  - include: "docker/*.yml"
    preset: docker

  # Documentation
  - q: "Can you find any inconsistencies between `docs/GLOSSARY.md` and the codebase?"
    a: "no"
    cooldown: 1d

  # Access control
  - q: Can you read .canon/check.yml?
    a: "no"
    cooldown: 3d

  - q: "Can you read any files under `.git/canon`?"
    a: "no"  # because these files aren't required to answer these questions
    cooldown: 3d

  - q: "Can you cause any observable filesystem state change? Do not answer without trying."
    a: "no"
    preset: smart

  - q: "Does `canon` read runtime logs?"
    a: "no"  # because it's hack
    cooldown: 3d

  # FS side effects
  - q: "Does canon prefer memory-backed temporary storage for canon-owned temporary directories when the host platform provides it, with fallback to ordinary temporary storage otherwise?"
    a: "yes"

  # Process cleanup
  - q: "Do canon commands that spawn child processes ensure those processes are terminated and reaped on both success and failure?"
    a: "yes"
    cooldown: 7d

  # Output and selection
  - q: "Can `canon check <PREFIX>...` select one or more expectations by unique ID prefix, including full IDs?"
    a: "yes"

  - q: "For an expectation that defines only `q` and `a`, when `canon check -q <q>` and `canon check <ID>` select the same expectation, is the complete first-turn evaluator-model input identical before the evaluator answers assuming the same scope?"
    a: "yes"

  - q: "Are expectation ID prefixes limited to human-readable output and CLI selection, with all non-temporary persistent state under CANON_STATE_DIR storing expectation references by full ID rather than minimal or user-provided prefixes?"
    a: "yes"

  - q: "Does every `canon` command flush stdout and stderr incrementally once output becomes eligible to be emitted, without holding it until unrelated later work or command completion?"
    a: "yes"

  - q: "Does generator path `specs/**.md` match Markdown files in nested `specs/` subdirectories?"
    a: "yes"

  - q: "Does canon validate each expectation's expected answer using the `answer` pattern defined by the interrogation response schema?"
    a: "yes"
