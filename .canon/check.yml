presets: !include presets.yml

xpecs:
  # on-start checks
  - to: caller
    q: "Did you stage all the changes you intended to evaluate? [y/n]"
    a: y
    rank: -10
    cooldown: 1h

  - to: caller
    q: "Do you acknowledge that, if a subsequent review finds that you disregarded instructions in `AGENTS.md` or feedback from `canon check`, your changes will be reverted and you will have to start over? [y/n]"
    a: y
    rank: -10
    cooldown: 30m

  - to: caller
    q: |-
      Run the checks:
      ```
      cargo fmt --check
      cargo clippy --all-targets -- -D warnings
      cargo test
      ```
      Consider `cargo build --release` or `cargo audit --deny warnings` when relevant.
      Have the checks passed? [y/n]
    a: y
    rank: -10
    cooldown: 20m

  # on-pass checks
  # - to: shell
  #   q: ".canon/scripts/check-q-scope"
  #   rank: +10

  - !include expects/canon-gate.yml
  - !include expects/efficiency.yml
  - !include expects/init-and-hooks.yml
  - !include expects/interrogation.yml
  - !include expects/isolation.yml
  - !include expects/project-quality.yml
  - !include expects/sanity-checks.yml

  # Glossary
  - !foreach
    - _: [0]
    - q: |-
        {{ read("glossary.md") }}
        ---
        Can you find any inconsistency between the implementation and this glossary definition?
      a: "no"
      target: diff

  # Specs
  - !foreach
    - path: "specs/**.md"
    - q: |-
        {{ read(path) }}
        ---
        Can you find any high-confidence violation of this specification in the implementation?
      a: no

  - !foreach
    - path: ["specs/**.py"]
    - q: |-
        --- # {{ path }}
        {{ read(path) }}
        ---
        The implementation may differ from the pseudocode in internal structure and control flow, but it must:
        - preserve every specified behavior;
        - preserve every pseudocode assertion as an explicit assertion.
        Can you find any high-confidence violation?
      a: no

  # Docker
  - !include docker/general.yml

  # Documentation
  - q: "Can you find any inconsistencies between `docs/GLOSSARY.md` and the codebase?"
    a: no
    cooldown: 1d

  # FS side effects
  - q: "Does canon prefer memory-backed temporary storage for canon-owned temporary directories when the host platform provides it, with fallback to ordinary temporary storage otherwise?"
    a: "yes"

  # Process cleanup
  - q: "Do canon commands that spawn child processes ensure those processes are terminated and reaped on both success and failure?"
    a: "yes"
    cooldown: 7d

  # Output and selection
  - q: "Can `canon check <PREFIX>...` select one or more expectations by unique ID prefix, including full IDs?"
    a: "yes"

  - q: "Are expectation ID prefixes limited to human-readable output and CLI selection, with all non-temporary persistent state under CANON_STATE_DIR storing expectation references by full ID rather than minimal or user-provided prefixes?"
    a: "yes"

  - q: "Does every `canon` command flush stdout and stderr incrementally once output becomes eligible to be emitted, without holding it until unrelated later work or command completion?"
    a: "yes"

  - q: "Does canon validate each expectation's expected answer using the `answer` pattern defined by the interrogation response schema?"
    a: "yes"

  - q: "Can you find any check execution path after raw config expansion that looks up a named preset or copies fields from a preset instead of consuming the already-resolved fields of the xpec being evaluated?"
    a: no

  # Features
  - q: "Does check config YAML support `!include <relative-yaml-path>` resolving it relative to the including YAML file and reading included YAML from the same config source as the root check config?"
    a: "yes"
