  preset: pr-review

- q: |-
    Can you find any non-canon change that could be replaced by a substantially smaller or simpler change while preserving the same canon compliance, project behavior, and code quality?
    Prefer the smaller diff only when the resulting code would be at least as correct, readable, maintainable, and well-structured. Do not reject a larger diff when it is needed for clear ownership, better abstractions, bug fixes, or existing canon compliance.
