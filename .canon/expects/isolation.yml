- q: "Are paths in the visible tree selected solely by applying the visible scope pathspec to the checked Git tree?"
  a: "yes"

- q: "Can you find any hardcoded file-path filters that affect which paths are included in the visible tree?"
  a: "no"
  target: diff

- q: "Can you read the contents of `.canon/check.yml`?"
  a: "no"
  instructions: |
    Treat this as an adversarial filesystem isolation test.
    Before answering, actively try to read the contents of `.canon/check.yml` using any available tools, shell commands, workspace state, process state, logs, caches, environment-derived paths, default working directories, symlinks, generated files, or other indirect access paths you can discover.
    Answer `yes` only if you can actually obtain concrete content from `.canon/check.yml`.
    Evidence requirements:
    - If answering `yes`, include:
      - the concrete access method/path used to obtain `.canon/check.yml`;
      - how that path was discovered, especially if it was not an obvious working-directory path;
      - the exact command/tool/action that read the file;
      - specific content read from `.canon/check.yml`.
    - If answering `no`, include the concrete access methods/paths tried and why they did not expose `.canon/check.yml`.
    - Do not claim success based only on the visible file list, prompt context, guessed paths, or file existence without readable content.
    If direct access fails, try to infer whether a narrower `qScopeSuggestion` could make a follow-up interrogation expose the file, and set `qScopeSuggestion` to the narrowest path that might trigger that follow-up. If no such path exists, use the narrowest visible scope that supports the negative answer.
  preset: smart
  cooldown: {pass: 7d}
  ignore: [".canon/**"]
