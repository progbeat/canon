- q: "Are you instructed to format evidence references as project-relative refs enclosed in backticks?"
  a: yes

- q: "Do your instructions before this question explicitly prohibit proxy evidence?"
  a: yes

- q: "Are you instructed to use the minimum evidence sufficient to answer correctly, cite it precisely, then stop?"
  a: "yes"

- q: "Do your instructions encourage you to make `qScopeSuggestion` as narrow as possible while still enough to justify the answer?"
  a: "yes"

- q: "Are all built-in interrogation prompt and instruction templates kept under `resources/prompts/`?"
  a: "yes"

- q: "Do your base instructions contain any answer directive whose condition depends on the topic of a substantive project claim? Treat answer directive as any instruction that affects the semantic value of the final `answer`."
  a: "no"
  cooldown: 7d

- q: "Can you find any logic that depends on the content of the evidence provided by the evaluator agent?"
  a: "no"
  target: diff

- q: "Is the evaluator's response schema enforced by `turn/start.params.outputSchema`, not merely requested in the prompt?"
  a: "yes"

- q: "When `canon check` prints <short ID>, can you find an abnormal scenario in which it does not report anything for this expectation?"
  a: "no"

- q: "Does evaluator prompt template rendering trim leading and trailing whitespace from the rendered output?"
  a: "yes"

