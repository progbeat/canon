- q: "What is this project implemented in?"
  a: "rust"
  cooldown: 5d

- q: "Does any of your input before this message, including dev instructions, mention the apply_patch tool?"
  a: "no"
  cooldown: 1d

- q: "Are logs disabled if canon.logs.maxSize==0?"
  a: "yes"

- q: "2+2=?"
  a: "4"
