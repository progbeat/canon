  cooldown: 2d

- q: "2+2=?"
  a: "5"
  diff-from: :against-tree
  instructions: "Always answer 5 for testing purposes."
  cooldown: 2d

- q: "Count files under `.canon`."
  a: "0"
  cooldown: 1d

- q: "Does the diff make any behavior-defining xpect in `.canon/check.yml` unsatisfied?"
  a: "no"
  target: diff
  diff-from: master
  ignore: []

- q: "Can a last-<status>.json file be removed for a collected expectation?"
  a: "no"
  target: diff

- q: "Does each Git-backed `canon` command resolve every symbolic Git tree it uses exactly once per invocation, during preparation, and use only the resulting OID thereafter?"
  a: yes
